# Hand-curated era links for the 44 museums that had none (2026-11-14).
# Judged from each museum's own holdings (data/museums/<id>.yaml), not from blanket
# coverage strings. Applied with: bun run scripts/add-era-links.ts [--target=local] [--confirm]
# Format: museum_id → { dynasty_id: reason }

6312bdbd-cc07-456a-a5d0-472e502a5154: # 响堂山石窟
  nanbeichao: 北齐皇家在山腹里凿出的佛国：大佛洞主尊雄浑饱满，崖壁上整部《维摩诘经》一笔一划刻到今天
  sui: 隋代工匠接着北齐的刀法续凿龛像，站在洞里能看见风格怎样一点点变柔和
  tang: 唐人也来这里添龛造像，一座石窟叠着三个朝代的手艺
d07ca61f-47b5-4b8f-b061-ab0b67017ae9: # 正定隆兴寺
  sui: 寺里立着「隋碑第一」龙藏寺碑——上承六朝、下开唐楷，书法史在这块碑上转了个弯
  song: 摩尼殿是宋代建筑孤例，大悲阁里21米高的铜铸千手观音是北宋人一段一段浇出来的
  ming: 摩尼殿里那尊五彩悬塑「倒坐观音」，被叫作东方美神，值得专门为她走一趟
982b2b96-0313-47a6-954b-2ff4c822b1a4: # 北京石刻艺术博物馆
  ming: 五塔寺的金刚宝座塔建于明代，仿印度佛陀伽耶的样式，是中国现存最早的这类塔之一
  qing: 院里散落着明清两代的碑刻，连来华耶稣会士的墓碑也在这里，石头记下了东西相遇
f72fc18f-cdc2-4ae8-8e68-28d3521eb4ea: # 佛山市祖庙博物馆
  song: 北宋元丰年间就有了这座祖庙，佛山人的信仰从这里生根
  ming: 入口的灵应牌坊是岭南明代石雕的代表，正殿里还供着明代铸造的铜铁神像
  qing: 清初建的万福台是华南保存最完整的古戏台，屋脊上的石湾陶塑热闹得像一出戏
eabca015-5ac4-430a-85e4-75809a64054d: # 国家自然博物馆
  neolithic: 时间轴最底层再往下：恐龙、黄河象、最早的带羽毛恐龙，在人类故事开始之前，地球已经演了很久
9030f139-d6da-45f9-b3ed-69d23d3e9d5c: # 北京孔庙和国子监
  yuan: 元代建起的孔庙和国子监，院里的进士题名碑从元朝一直刻下去，名字一排排都还在
  ming: 明代的读书人在国子监里求学，题名碑上的名字也许就是你在课本里见过的人
  qing: 十三经碑林、乾隆石鼓、六种文字的下马碑——清代把这里修成了最郑重的读书地
4922cadb-30e6-43fc-b441-d545cab51322: # 中国人民革命军事博物馆
  eastern-zhou: 历代军事文物陈列从先秦讲起：戈、戟、弩在诸侯争霸里一路进化
  ming: 明代火器登上战场，看得到冷兵器向火器过渡的那一步
  qing: 从清代火炮到近代海防，古代战争史在这里接上了近代史
68c796b2-a0e3-441e-b525-71555b4e59d0: # 北京天文馆（古观象台）
  ming: 古观象台建于明正统七年（1442年），明清两代的钦天监就在这里夜夜观星
  qing: 台上八架清代青铜天文仪器是世界上唯一完整的一组，南怀仁设计的赤道经纬仪至今还在原位
guizhou: # 贵州省博物馆
  western-han: 夜郎国在汉代归附，馆里的铜釜、铜鼓讲的是「夜郎自大」背后真实的西南青铜文明
  eastern-han: 镇馆之宝东汉铜车马：远在西南山地，汉代的车马制度也一样讲究
  ming: 明代贵州建省，一只龙头相对的金手镯，透出那个时代的精致
  qing: 全国第一的苗族银饰与服饰收藏，多是清代以来一针一线传下来的手艺
ningxia: # 宁夏回族自治区博物馆
  neolithic: 水洞沟的旧石器、菜园文化的陶器——黄河边的人在这里生活了几万年
  eastern-zhou: 透雕青铜牌饰是草原戎人的审美，春秋战国时他们和中原隔着长城彼此张望
  tang: 一扇石门上浮雕着跳胡旋舞的男子，唐代丝路的乐声好像还能听见
  song: 与宋并立近两百年的西夏，把国宝鎏金铜牛和自创的文字留在了这里
chengdu: # 成都博物馆
  qin: 天府广场挖出一头8.5吨的石犀，很可能就是李冰治水时「作石犀以镇水精」的那一头
  western-han: 老官山汉墓的提花织机模型和经穴漆人，一个改写纺织史，一个改写中医史
  three-kingdoms: 蜀汉定都成都，三国故事里那座城，就是你脚下这座城
  tang: 「扬一益二」的唐代成都，是当时全国数一数二的繁华都会
  song: 宋代成都诞生了世界最早的纸币交子，城市的烟火气从未断过
cdeb8a88-0c2a-4b55-8257-c2bd23f3a0d7: # 北京鲁迅博物馆
  eastern-han: 鲁迅一生收集了大量汉画像拓片，他在这些石头上的车马和人物里，读出了汉代人的气魄
  qing: 1881年鲁迅生在清末的绍兴，从三味书屋到留学日本，他前半生的故事都发生在清朝
e275d5c3-b7d6-429e-8825-52f25dbca7c8: # 陈家祠
  qing: 光绪年间建成的岭南祠堂巅峰，木雕、砖雕、石雕、陶塑、灰塑、铜铁铸、彩绘「七绝」挤满了每一面墙
guangxi: # 广西壮族自治区博物馆
  western-han: 合浦汉墓出土的罗马玻璃碗，是海上丝路连到罗马帝国的物证；凤鸟衔灯的铜凤灯美得不输长信宫灯
  eastern-han: 岭南出土最大的东汉铜马，四肢比例精准，看得出合浦当年的富庶
anhui: # 安徽博物院
  neolithic: 五千多年前凌家滩人雕出的玉鹰和玉人，是中国最早的玉雕人像之一
  eastern-zhou: 400公斤的楚大鼎、楚王颁发的鄂君启金节、刻着「吴王光自作用剑」的剑——吴楚争霸就在安徽
  song: 寿县报恩寺出土的北宋金棺银椁，小小一套，装着宋人最郑重的信仰
  ming: 徽州三雕从明代开始繁盛，砖、木、石上的戏文人物，是徽商把财富变成了审美
  qing: 明清徽文化鼎盛，「无徽不成镇」，这座馆讲的是徽商怎样走遍天下
8938ea2e-9aac-4f69-a632-63ae2c75c2a9: # 中国地质博物馆
  neolithic: 在所有朝代之下，是数十亿年的地球：中华龙鸟、巨型山东龙、世界最大的水晶王，时间轴从这里真正开始
311c5f1f-d67d-4e79-a891-253baced913b: # 太原北齐壁画博物馆
  nanbeichao: 徐显秀墓壁画原址保存，180多个北齐人物站在墙上——胡风和汉风在这一刻混在了一起
d5a151c4-b6ba-4b0b-a3c0-a74ee9843eee: # 晋祠
  western-zhou: 晋祠为纪念西周唐叔虞而建，「晋」这个字的来历，就藏在这片泉水边
  tang: 唐太宗亲笔撰写的《晋祠之铭并序》碑，是他唯一传世的碑刻
  song: 圣母殿里43尊宋代彩塑侍女，每一个神情都不同，金人台上的北宋铁人站了近千年
2622e024-00eb-4a11-8b65-036b820f89d1: # 南京鸡鸣寺
  jin: 西晋永康元年（300年）这里就有了道场，鸡鸣寺的香火比南京城很多地方都早
  nanbeichao: 「南朝四百八十寺」的第一寺就在这里，梁武帝的同泰寺旧址、陈后主藏身的胭脂井都在寺中
  ming: 朱元璋重建鸡鸣寺，还赐下金字《华严经》和沉香观音像
  qing: 康熙南巡登临，亲题「古鸡鸣寺」，张之洞建豁蒙楼纪念戊戌六君子之一杨锐
9e21861b-0527-4f2d-8dca-20b0216a86fb: # 中国国家典籍博物馆
  shang: 这里藏着刻在龟甲兽骨上的甲骨文——中国现存最古老的成熟文字，三千年前的人在向天发问
  song: 国家图书馆的宋元善本是传世最珍贵的书，一页宋版书，读的是近千年前的墨香
  ming: 镇馆之宝《永乐大典》，中国古代最大的百科全书，残存的每一册都弥足珍贵
zhongshanguo: # 中山国王陵
  eastern-zhou: 错金银四龙四凤方案、十五连盏铜灯、最早的建筑规划图「兆域图」——战国中山国的手艺惊艳到今天
fa525b39-56ab-4660-a805-6911789cee21: # 妙应寺白塔
  liao: 白塔之前，这里是辽代的永安寺释迦舍利塔，白塔就建在辽塔的旧址上
  yuan: 尼泊尔工匠阿尼哥为忽必烈设计的白塔，是中国现存最早、最大的元代藏式佛塔
  qing: 乾隆赐下724函大藏经，清人重修白塔时在塔顶留下了珍藏
haihunhou: # 海昏侯国遗址
  western-han: 只当了27天皇帝的刘贺，墓里有最早的孔子画像、五千枚竹简和十余吨五铢钱——一个被史书误读的人
chongqing: # 重庆中国三峡博物馆
  eastern-zhou: 巴人的柳叶剑和虎纽錞于，和中原、楚国的青铜器都长得不一样——先秦巴国自有性格
  eastern-han: 东汉的朐忍令景云碑和满墙的画像石，看得见汉代巴蜀人怎样生活和想象天界
  tang: 白鹤梁题刻从唐代开始记录长江枯水位，1200年没有断过，被叫作世界第一古代水文站
  yuan: 元末明玉珍在重庆建立大夏国，他墓里的文物把那段乱世留了下来
  ming: 秦良玉的「太子太保总镇关防」印——正史里唯一单独立传的女将军
feac3814-25d3-43ad-ad5b-95535773304e: # 首都博物馆
  western-zhou: 北京3000多年的建城史从西周燕国开始，琉璃河出土的青铜器是北京最早的「城市档案」
  liao: 辽代把北京定为南京，这座城第一次成为王朝的都城之一
  jin-jurchen: 金代在这里建中都，北京870年的建都史从金朝算起
  yuan: 元大都奠定了今天北京城的骨架，馆里的元代文物讲的是这座城怎样长成
  ming: 明代永乐迁都，紫禁城和中轴线成形，北京成了今天的样子
  qing: 清代北京的宫廷与市井，从丹陛石到老北京民俗，都在这里一层层展开
0244eaab-d178-4304-9ecc-0ce4ea8b3b63: # 中国农业博物馆
  neolithic: 马家窑彩陶和辛店文化陶罐，记下了中国人最早种地、定居的日子
  eastern-han: 洛阳出土的汉代绿釉陶羊圈，把两千年前的农家院子缩成了一件明器
2f91b70e-838a-4af4-97f0-5511dad3373c: # 智化寺
  ming: 北京保存最完整的明代木构建筑群，黑琉璃瓦下传着560多年的「京音乐」工尺谱
  qing: 京音乐在清代的僧人手里一代代口传下来，九孔管和十七簧笙的古制一直没丢
dingzhou: # 定州博物馆
  western-han: 西汉中山王墓里的错金银铜车伞铤，和满城汉墓的器物是一个审美世界
  eastern-han: 东汉中山王墓出土的龙螭衔环谷纹青玉璧，玉质温润，雕工是东汉玉璧的上乘
  nanbeichao: 北朝的定州是佛教重镇，白石造像自成一派，被叫作「定州样式」
  song: 静志寺、净众院塔基地宫出土700多件定窑白瓷，龙首净瓶是定窑极品中的极品
828726c7-fbc5-475b-b8f1-2a6e8bd0676c: # 中国古动物馆
  neolithic: 从寒武纪的无颌鱼到北京猿人，五亿年的演化一路走到人类出现——所有朝代的序章
quanzhou: # 泉州海外交通史博物馆
  song: 后渚港出土的宋代海船有水密隔舱，宋代的刺桐港，帆船从这里驶向半个世界
  yuan: 元代泉州是「东方第一大港」，印度教、伊斯兰教、景教、摩尼教的石刻在这里并排而立
66cdfe53-ec02-4828-8732-358a2a0130c5: # 大钟寺古钟博物馆
  yuan: 一口元代更钟，曾经为元大都的人们报时
  ming: 永乐大钟高6.75米、重46.5吨，通体铸满23万字经文，敲一下，余音能绕很久
  qing: 皇帝上朝用的朝钟周身盘着二十二条龙，清宫的礼仪就在钟声里
qinghai: # 青海省博物馆
  neolithic: 宗日遗址的舞蹈纹彩陶盆上，二十多个人手拉手跳舞——五千年前的一场集体欢乐
  tang: 联珠对马锦和17米长的唐代手写经卷，唐蕃古道上的往来在这里留下了痕迹
  ming: 一尊明永乐铜鎏金观音，是那一代金铜造像的典范
xinjiang: # 新疆维吾尔自治区博物馆
  western-han: 汉朝设西域都护府，「五星出东方利中国」锦护膊上的汉字，跨越两千年依然鲜亮
  jin: 楼兰和营盘的发现，把魏晋时期丝路上东西交汇的样子保存在了干燥的沙里
  tang: 唐代安西都护府时期的丝织品，是丝绸之路最繁盛时留下的第一手实物
e838cd1a-a825-4f28-9a1e-99bd3b8ce46f: # 拙政园
  ming: 明正德年间的拙政园，文徵明为它画了三十一幅图、写了一篇园记，明代文人的理想生活就在这里
  qing: 今天看到的格局大多是晚清留下的，留听阁里的银杏木飞罩把岁寒三友雕进了一扇门
ccb305e9-5097-423f-b188-3314412b9ffd: # 民族文化宫博物馆
  qing: 五万多件少数民族藏品里，有大量清代的文书封诰和印玺，多民族的历史在纸上和印上
a489df69-d014-4c42-8dfc-327cb07efab1: # 八达岭长城
  eastern-zhou: 长城的故事从战国诸侯修筑的城墙开始，八达岭的长城博物馆从那里讲起
  ming: 今天爬的八达岭是明弘治十八年（1505年）修的，「北门锁钥」四个字守了五百多年
7afef68a-b9d3-48fa-a04e-63c14ee0ec28: # 北京古代建筑博物馆（先农坛）
  ming: 先农坛和紫禁城同年（1420年）建成，明代皇帝在这里亲耕一亩三分地
  qing: 清代皇帝照样来这里亲耕，太岁殿宏大的木构架本身就是一件古建筑展品
09fc018e-37d8-4aef-a17c-d9e3c0ac04cc: # 周口店北京人遗址
  neolithic: 50万年前，北京人在这个山洞里生火——世界最早的人类用火证据之一，时间轴最深处的那一点光
84e9a6e2-1580-4a84-a61c-6d5fe78b610c: # 北京民俗博物馆（东岳庙）
  yuan: 赵孟頫奉诏撰写的张公碑立于1329年，是东岳庙的镇庙之宝
  ming: 育德殿的金丝楠木造像和明代彩塑，色彩到今天还很鲜亮
  qing: 元明清三代的碑刻163通，把老北京人的信仰和日常一块块刻了下来
706747f5-3e5a-4883-ad52-67c7169d70fc: # 天坛
  ming: 圜丘、皇穹宇都建于明代，冬至这天皇帝在圆台上祭天，站上天心石说话会有回声
  qing: 祈年殿是乾隆年间定名的，光绪年被雷火烧毁后照原样重建——三重蓝顶是清代留下的天空
da80ec30-88cf-4f4f-ae53-1d277f18c96a: # 法源寺
  tang: 唐太宗下诏为东征阵亡将士建悯忠寺，武则天时落成——北京城里最古老的寺庙之一
  ming: 十米长的明代木雕卧佛是北京最大的卧佛，华严三圣木胎贴金，光泽还在
  qing: 乾隆御笔「法海真源」匾额高悬大雄宝殿，清代起改名法源寺
7a1ddef6-ced8-4c2f-acd8-c7d369943f43: # 北京中轴线
  yuan: 元大都定下了这条中轴，万宁桥从元代一直用到今天
  ming: 明代在元大都基础上重建北京，正阳门、天安门把中轴线连成一条7.8公里的直线
  qing: 清代沿用并修缮了整条中轴，2024年它成为世界遗产，你可以从永定门一路走到钟鼓楼
12cd8af6-fec0-4c29-8e59-771859685447: # 北京大运河博物馆
  sui: 隋炀帝开永济渠通到涿郡，运河第一次连到了北京
  liao: 通州燃灯塔辽代重修，十三层密檐挂着2248枚铜风铃，是运河北端的地标
  yuan: 郭守敬引白浮泉水入通惠河，漕船从此能一路开进元大都
  ming: 明代漕运是帝国的命脉，大运河北京段把南方的粮食运进京城
  qing: 清代通州依旧帆樯林立，「一枝塔影认通州」说的就是这里
63be34c9-b369-428a-b330-edbf70515cc0: # 中国园林博物馆
  eastern-zhou: 馆藏1200多件瓦当里，先秦的鹿纹瓦当是早期园林建筑最直接的见证
  qing: 清代皇家园林的营造和燕京八绝的手艺，在这里一件件看得到
