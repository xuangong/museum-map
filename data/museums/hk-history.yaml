id: hk-history
name: 香港历史博物馆
lat: 22.3016
lng: 114.1772
location: 香港九龙尖沙咀漆咸道南100号（香港科学馆侧）
level: 香港特别行政区康乐及文化事务署辖下综合性历史博物馆（香港规模最大的历史类博物馆）
core_period: 新石器—近现代（重点东汉、明清至香港开埠后二百年）
specialty: 香港规模最大的历史类博物馆。总楼面17,500平方米，由港府拨款港币3.9亿元兴建，巴马丹拿建筑及工程师有限公司按威拿庄信的建筑概念设计，外型与毗邻的香港科学馆相协调。馆藏逾170,000件，涵盖民俗、本地历史、早期中国影像、孙中山与近代中国史、海防历史及军事五大范畴。镇馆常设展「香港故事」于2026年4月1日以全新版本重开，汇聚逾2,800件展品，分四大篇章讲述跨越六千年的香港。辖下四间分馆：李郑屋汉墓博物馆（深水埗）、罗屋民俗馆（柴湾）、葛量洪号灭火轮展览馆（鲗鱼涌）、孙中山纪念馆（中环半山）。
dynasty_coverage: 新石器（南丫岛等沿海遗址）→ 东汉（李郑屋汉墓）→ 唐（屯门军镇）→ 宋（官富场盐务、宋王台）→ 明清（迁海令、新界宗族、鸦片战争）→ 近现代（开埠、抗战、回归）
timeline: 1962年成立大会堂美术博物馆 → 1969年易名香港博物美术馆 → 1975年分拆为香港艺术馆与香港博物馆 → 1983年迁九龙公园临时馆址 → 1998年4月1日易名香港历史博物馆、同年7月迁入尖沙咀漆咸道南现址 → 2020年10月「香港故事」旧版闭展翻新 → 2026年4月1日「香港故事」全新版重开
treasures:
  - name: 李郑屋汉墓「大吉番禺」墓砖（东汉，香港唯一汉代墓葬出土）
  - name: 李郑屋汉墓随葬陶屋、陶仓与青铜器组合（东汉）
  - name: 梦周文教基金会早期中国影像藏品（清末至民国初年，逾24,000件）
  - name: 香港开埠至战前维多利亚城历史照片与地契文书
  - name: 新界宗族祠堂礼器与传统婚嫁器物
  - name: 大眼鸡渔船与水上人艇户生活实物
halls:
  - name: 「香港故事」常设展览（2026年4月全新版，四大篇章逾2,800件展品）
  - name: 国家安全展览厅
  - name: 专题展览厅（香港赛马会呈献系列等大型借展）
  - name: 参考资料室
artifacts:
  - name: 李郑屋汉墓「大吉番禺」墓砖
    period: 东汉（公元1—2世纪）
    description: —1955年8月香港政府于深水埗兴建徙置大厦时发现李郑屋汉墓，这是香港迄今发现的唯一一座汉代墓葬。墓室为砖室十字形结构，部分墓砖侧面模印「大吉番禺」等隶书文字。「番禺」即汉代南海郡番禺县治，铭文直接实证香港这片土地在两千多年前已纳入中原王朝郡县体系。墓与出土物现由本馆分馆李郑屋汉墓博物馆原址保存展示。
  - name: 李郑屋汉墓出土陶屋与陶器组合
    period: 东汉（公元1—2世纪）
    description: —李郑屋汉墓共出土五十余件随葬器物，以陶明器为主，包括陶屋、陶仓、陶灶、陶井及各式罐、壶、盒，另有铜镜、铜碗等青铜器。陶屋作干栏式或三合院式，屋顶起脊、四壁开窗，是研究汉代岭南民居形制的实物标本；成组明器则反映「事死如事生」的汉人丧葬观念已传播至珠江口一带。
    image_url: /img/f047fe61495408ee.jpg
    image_license: PD
    image_attribution: Chong Fat
  - name: 南丫岛与大湾一带史前遗物
    period: 新石器时代晚期至青铜时代（距今约6,000—3,000年）
    description: —香港沿海沙丘遗址群出土的彩陶、几何印纹陶、石锛、石环玦及青铜兵器铸范，与珠江三角洲、环珠江口史前文化面貌一致。这批材料把香港的人类活动上推至六千年前，也说明香港自新石器时代起便属岭南文化圈，而非近代才被「开发」的荒岛。
  - name: 香港四大族群民俗（本地·客家·福佬·蜑家）
    period: 明清至近代
    description: —明清两代，邓、文、廖、侯、彭五大氏族陆续迁入新界建村立祠，其后客家、福佬（鹤佬）与蜑家（水上人）陆续在此落脚，形成香港四大族群格局。展区以实景复原呈现围村祠堂、客家农舍、福佬渔村与水上人艇户生活，展品含祠堂神主与祭器、婚嫁花轿、太平清醮与舞火龙的仪仗道具、渔具与船模。清初迁海令曾令沿海居民内迁、村落尽废，复界后宗族重建的过程，构成香港乡村社会的骨架。
    image_url: /img/257d09a118d96f0d.jpg
    image_license: CC-BY-4.0
    image_attribution: Wpcpey
  - name: 早期中国影像藏品（梦周文教基金会捐赠）
    period: 清末至民国初年（19世纪中叶—20世纪初）
    description: —2024年11月，本馆接受梦周文教基金会捐赠逾24,000件清末至民国初年中国影像藏品，含蛋白照片、玻璃底片、立体照片与相册。内容涵盖广州十三行、香港开埠初期维多利亚港、通商口岸市井与人物肖像，是研究晚清中国社会与早期摄影史的重要一手材料。
  - name: 香港开埠与近代都市变迁史料
    period: 1841年至今
    description: —自1841年英军登陆水坑口起，展品串起鸦片战争条约文本复制件、维多利亚城全景照片、早期银行钞票与地契、三年零八个月日占时期的军票与配给证、战后徙置区与制造业实物，直至1997年7月1日回归。四大篇章的终章落在香港由历史重镇蜕变为国际都会的历程。
    image_url: /img/af3ba51f54bddc97.jpg
    image_license: CC-BY-4.0
    image_attribution: Wpcpey
dynasty_connections:
  - dynasty: 东汉
    description: 李郑屋汉墓及其「大吉番禺」墓砖，是香港属汉代南海郡番禺县的直接物证，也是全港唯一的汉墓。
  - dynasty: 宋
    description: 宋代于今九龙湾一带设官富场管理盐务，宋王台传说与九龙宋代遗迹在展览中构成香港纳入宋代行政与经济体系的线索。
  - dynasty: 明
    description: 明代新界五大氏族建村立祠、屯门海战与海防卫所，展现珠江口在明代海上贸易与防务中的位置。
  - dynasty: 清
    description: 清初迁海令与复界、鸦片战争至1841年开埠，是「香港故事」中西汇流篇章的历史起点。
