id: cixian-beichao
name: 北朝考古博物馆
lat: 36.3956
lng: 114.3426
location: 河北省邯郸市磁县和谐大道高架桥西段北侧（冀南新区，G107国道旁）
level: 国家二级博物馆 / 依托全国重点文物保护单位磁县北朝墓群（1988年第三批）
core_period: 东魏—北齐（534—577年，邺城为都）
specialty: 以北朝考古为主题的专题博物馆，全称磁县北朝考古博物馆。占地约200亩，投资约1.66亿元，建筑面积约12000平方米，展陈面积4000余平方米。馆藏文物5000余件，主要出自磁县北朝墓群中东魏、北齐皇室贵胄墓葬，有陶俑、瓷器、壁画、墓志、碑刻、金银器等；现陈展691件，其中一级文物17件、二级文物11件。基本陈列「走向隋唐——东魏北齐文化艺术集萃」讲的是一个短命却关键的时代：鲜卑与汉、草原与中原、东方与拜占庭在邺城交汇，为隋唐盛世备好了底色。大门迎面是把茹茹公主墓陶骆驼放大五十倍的「丝路驼铃」雕塑；特别展厅按1:1复原了湾漳北朝大型壁画墓。
dynasty_coverage: 北魏（分裂前夜、迁都与邺城）→ 东魏（534年迁都邺城，磁县为都城西北的皇室葬区）→ 北齐（550—577年，北朝民族融合的收束）
timeline: 东魏、北齐时期磁县一带成为邺都西北的皇室贵胄葬区 → 后世长期被讹传为「曹操七十二疑冢」 → 1970年代起陆续发掘尧峻墓、高润墓、李尼墓等 → 1978年9月—1979年6月发掘茹茹公主墓 → 1987—1989年发掘湾漳北朝壁画墓 → 1988年磁县北朝墓群公布为第三批全国重点文物保护单位 → 2020年9月19日北朝考古博物馆正式开放
treasures:
  - name: 茹茹公主墓陶骆驼（被誉为「镇馆之宝」）
  - name: 茹茹公主墓拜占庭金币两枚（阿纳斯塔修斯一世、查士丁一世铸，国家一级文物）
  - name: 茹茹公主墓萨满巫师俑
  - name: 湾漳北朝壁画墓按盾武士俑
  - name: 胡汉陶俑群（「北朝小兵马俑」）
  - name: 湾漳北朝大型壁画墓1:1复原（壁画总面积约700平方米）
halls:
  - name: 第一展厅「煌煌帝都——北朝历史与考古」
  - name: 第二展厅「浩浩典仪——北朝葬俗礼仪文化」
  - name: 第三展厅「泱泱文明——东魏北齐社会生活与民族融合」
  - name: 特别展厅 · 湾漳北朝大型壁画墓1:1复原
artifacts:
  - name: 茹茹公主墓陶骆驼
    period: 东魏
    description: —1978年发掘于磁县大冢营村北的茹茹公主墓，高25厘米。骆驼正作旅途小憩：左前腿跪地、右前腿蹬立，头部微抬、目光远眺，驼背上驮着帐具、丝绸、皮囊、大雁与兽腿。静中有动，被视为北朝陶塑的艺术极品，也是这座博物馆的「镇馆之宝」——大门前那尊放大五十倍的「丝路驼铃」雕塑，原型就是它。
  - name: 拜占庭金币（两枚）
    period: 东魏墓葬出土，分铸于阿纳斯塔修斯一世（491—518年）与查士丁一世（518—527年）在位期间
    description: —出自茹茹公主墓，为国家一级文物。1号币直径1.6厘米、重2.7克，正面为戴冠着甲、肩扛长矛的皇帝半身像，背面为手持长柄十字架的带翼女神侧身立像；2号币直径1.8厘米、重3.2克，背面女神正面站立，一手持十字架、一手托十字圣球。君士坦丁堡的金币一路东来，埋进一位十三岁公主的墓里，是东魏与丝路西端往来的实证。（洛阳汉魏洛阳故城遗址博物馆也藏有一枚阿纳斯塔修斯一世金币，可以对照着看。）
  - name: 茹茹公主墓壁画（墓道西壁摹本）
    period: 东魏武定八年（550年）
    description: —茹茹（柔然）公主嫁给高欢之子高湛，550年病逝时年仅13岁，按皇室规格下葬。墓于1978年9月至1979年6月发掘，出土陶俑1064件，有送亲仪仗俑、生活服侍俑、胡人俑及鞍马、骆驼、家禽家畜等。展厅陈列的是墓道西壁壁画摹本；配图为原墓壁画中的神兽局部，线条奔放、设色浓烈。
    image_url: /img/4ed37ba14f1cc031.jpg
    image_license: PD
    image_attribution: Wikimedia Commons · PD
  - name: 萨满巫师俑
    period: 东魏
    description: —出自茹茹公主墓。身穿长袍、头戴尖帽，双腿分立作舞蹈状，右手微抬，左手持锯齿形法器，嘴巴微张像在吟唱。柔然公主的随葬队伍里出现草原萨满，是北朝多民族信仰并存的生动注脚。
  - name: 按盾武士俑
    period: 北齐
    description: —出自湾漳北朝壁画墓。身着明光铠，双手按住兽面盾牌，挺胸叠肚、巍然屹立。湾漳大墓出土陶俑1800多件，多为仪仗侍卫俑，与墓道壁画中的人物一一对应，共同构成皇帝出行的大驾卤簿。
  - name: 胡汉陶俑群
    period: 东魏—北齐
    description: —馆中陶俑数量庞大，被称为「北朝小兵马俑」。细看面容就能分出族属：汉人面相平和，鲜卑人与西域人深目高鼻，服饰也各具特色。把它们摆在一起，就是一部写在泥土上的民族融合史。
  - name: 湾漳北朝大型壁画墓（1:1复原）
    period: 北齐
    description: —1987年发掘于磁州镇湾漳村，墓葬总长52米，出土文物2200余件，经考证为北齐文宣帝高洋墓。特别展厅按1:1比例复原：墓道全长37米，壁画总面积约700平方米，其中墓道两壁约320平方米；东壁前端绘青龙，西壁前端绘白虎，其后各绘53人组成的仪仗队列；墓室顶部为四角攒尖，绘满星宿与银河。走进去，就是走进一位北齐皇帝的地下世界。
  - name: 东魏北齐墓志
    period: 东魏—北齐
    description: —磁县北朝墓群出土墓志众多，详细记载墓主身份与生平，是确认墓主身份的关键材料——这片墓群过去被讹传为「曹操七十二疑冢」，经考古发掘与考证才正名为北朝墓群。书风介于汉隶与唐楷之间，是观察魏碑向唐楷过渡的好样本。
dynasty_connections:
  - dynasty: 东魏
    description: 534年东魏迁都邺城，磁县成为都城西北的皇室贵胄葬区；茹茹公主墓见证东魏与柔然的和亲，墓中的拜占庭金币则连着丝路西端。
  - dynasty: 北齐
    description: 湾漳北朝壁画墓经考证为北齐文宣帝高洋墓，1:1复原的墓道仪仗与星象图，是北齐皇家礼制的完整再现。
  - dynasty: 北朝
    description: 鲜卑、汉、西域多民族陶俑与墓志书风的变化，串起「走向隋唐」的主题——北朝的民族融合为隋唐统一铺好了路。
