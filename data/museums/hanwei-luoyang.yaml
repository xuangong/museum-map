id: hanwei-luoyang
name: 汉魏洛阳故城遗址博物馆
lat: 34.7239
lng: 112.6089
location: 河南省洛阳市瀍河回族区白马寺镇翟泉村（汉魏洛阳故城遗址内，洛阳市区以东约15公里）
level: 考古遗址博物馆（2025年开馆）/ 依托全国重点文物保护单位、世界文化遗产「丝绸之路：长安—天山廊道的路网」组成部分汉魏洛阳故城
core_period: 东汉—北魏（上溯西周成周，东汉、曹魏、西晋、北魏相继建都于此）
specialty: 汉魏洛阳故城的遗址博物馆，国家「十四五」文化保护传承利用工程与中华文明探源工程重大项目。占地约219亩，展厅面积约8200平方米，展出1300余件（套）文物，以洛阳地区考古出土品为主。建筑借鉴汉魏高台形制，宫墙环绕中心大殿，自正南门沿中轴线依次排布汉阙广场、候车廊、拱桥与核心展厅，以微缩都城复刻「建中立极」的空间秩序，外墙用夯土墙垣，像是从遗址里「长」出来的。基本陈列《天中国史》不按朝代顺序铺陈，而是从都城制度、民族融合、世界影响三个角度讲这座作为都城长达约600年的城市。免费开放，需预约，周一闭馆。
dynasty_coverage: 西周（周公营洛，「宅兹中国」）→ 东周 → 东汉（太学、熹平石经）→ 曹魏（太极殿、正始石经、西朱村大墓）→ 西晋（辟雍、太学）→ 北魏（孝文帝迁洛、永宁寺、北邙帝陵）
timeline: 1962年起中国社会科学院考古研究所持续勘探发掘汉魏洛阳故城 → 2020年启动筹建 → 2022年立项 → 2023年8月开工 → 2024年1月主体结构封顶 → 2025年4月定名「汉魏洛阳故城遗址博物馆」 → 2025年6月5日试开放 → 2025年7月16日正式开馆
treasures:
  - name: 东汉昭君出塞镜（外区七言长铭七十字，两见「中国」字样）
  - name: 熹平石经残石（东汉熹平年间，中国首次将儒家经典全文刻石）
  - name: 东罗马（拜占庭）阿纳斯塔修斯一世金币（北魏墓出土）
  - name: 北朝石刻子母阙围屏石棺床（2022年孟津朱仓村出土，洛阳地区首次考古出土）
  - name: 曹魏西朱村大墓刻铭石牌
  - name: 西晋中书侍郎荀岳墓志
  - name: 北魏永宁寺塔基泥塑像残块与中型菩萨头像
halls:
  - name: 第一展厅「天下河洛 大都惟中」（择中立国 · 皇建有极 · 甲子华章）
  - name: 第二展厅「汉魏经典 魂脉融合」（民族融合 · 国制典范 · 天下大凑）
  - name: 第三展厅「千秋创举 世界大同」（四方都城 · 汉魏文章 · 客家祖根 · 丝路起点）
  - name: 「片羽吉光—汉魏洛阳精品展」精品厅
  - name: 临时展厅
artifacts:
  - name: 熹平石经残石
    period: 东汉熹平年间（172—178年）
    description: —中国历史上第一次把儒家经典全文刻上石碑。蔡邕等学者以隶书书写七经，立于洛阳太学，供天下士子校勘典籍；汉末董卓焚毁洛阳宫庙，太学荒废，石经散落。上世纪二三十年代起，洛阳朱家圪垱村一带陆续出土残石，展出的这些残石分属《鲁诗》《仪礼》《论语》《春秋》诸经。同一展区还能对照曹魏正始石经——每个字都以古文、小篆、隶书三体并刻。
  - name: 辟雍碑（3D打印复原件）
    period: 西晋咸宁四年（278年）
    description: —碑文记晋武帝司马炎与太子司马衷亲临辟雍视学的盛况，称太学「东越于海，西及流沙，并时集至万有余人」，可见当时连西域属国的学子也远道来洛阳求学。碑阴刻大量官员、博士与学生的姓名籍贯，是研究西晋行政区划、士族分布与民族融合的一手材料。展厅中为3D打印复原件。
    image_url: /img/73a9c9590353d55a.jpg
    image_license: CC-BY-SA-4.0
    image_attribution: Windmemories
  - name: 曹魏刻铭石牌（石楬）
    period: 曹魏
    description: —2015年8月至2016年12月，洛阳市文物考古研究院抢救性发掘伊滨区寇店镇西朱村M1曹魏大墓，出土刻铭石牌200余枚，逐一记下随葬品的名称与数量，顶部圆孔原用于系挂在对应器物上。墓室宏大、规格极高，墓主应为曹魏皇室成员。此前只有曹操高陵出土过同类石牌，两处互相印证。
    image_url: /img/91369588a9e68663.jpg
    image_license: CC-BY-SA-4.0
    image_attribution: Windmemories
  - name: 西晋中书侍郎荀岳墓志
    period: 西晋
    description: —青石质，圭首，四面阴刻隶书，详细记录颍川荀岳的生平与宗族情况。志文中对子女取名的记载，让人得以窥见晋代幼儿命名习俗；家族成员聚葬一处的安排，也反映了当时聚族而葬的礼俗。
    image_url: /img/e152c5949fcd5681.jpg
    image_license: CC-BY-SA-4.0
    image_attribution: Windmemories
  - name: 昭君出塞镜
    period: 东汉
    description: —镜背中心为扁球形钮，钮座环绕十三枚乳钉，间以十二字铭文「仲作，宜侯王，复（服）此竟（镜）者大富昌」。内区四枚乳钉把画面分成四组人物车马画像，并附榜题；外区是一首七言长诗，共七十字，详记昭君故事，铭文中两次出现「中国」二字。
    image_url: /img/2ce75116547d06f6.jpg
    image_license: CC-BY-SA-4.0
    image_attribution: Windmemories
  - name: 东罗马（拜占庭）金币
    period: 北魏墓葬出土，铸于阿纳斯塔修斯一世在位期间（491—518年）
    description: —正面为拜占庭皇帝阿纳斯塔修斯一世像，铭「DNANASTASIVSPPAVG」；背面为胜利女神维多利亚站像，左右分铭「VICTORI」「AAVGGGH」，重2.8克。据文化和旅游部报道，此币出土于洛阳衡山路北魏大墓——2012—2013年发掘、考古推测为北魏节闵帝元恭墓，金币的铸造年代也为墓葬断代提供了依据。远在君士坦丁堡铸造的金币埋进北魏帝陵，是洛阳作为丝绸之路东方起点的直接物证。
  - name: 永宁寺塔基泥塑像残块与中型菩萨头像
    period: 北魏
    description: —永宁寺是北魏迁都洛阳后营建的皇家寺院，九层木塔被誉为「千寺之冠」，后遭雷击焚毁。塔基出土的泥塑有各龛主尊、胁侍，也有贴壁的僧俗影塑：大像复原高1.7—3米，中像约1.4米，小像约0.7米，影塑约0.3米。精品厅中的中型菩萨头像方圆脸形，口形与耳廓线条细腻，更接近同时期龙门石窟宾阳中洞的菩萨形象，并带有女性化倾向。（另一件著名的永宁寺泥塑佛面像藏于洛阳博物馆。）
  - name: 石刻子母阙围屏石棺床
    period: 北朝（北魏晚期）
    description: —2022年底出土于洛阳市孟津区平乐镇朱仓村东北的一处北朝家族墓地，是洛阳地区首次考古出土的围屏石床。由4块石屏风与1对石刻子母阙构成，每屏3幅图像，局部涂朱贴金：一幅疑为男性墓主像，其余为「郭巨埋儿」「秋胡戏妻」「临深履薄」等孝子、列女、高士故事和出行仪仗；床外侧11幅为畏兽等神兽，床腿两侧雕狮子。两套围屏画风不同，记录了北魏晚期绘画由「瘦骨清像」转向「雄健饱满」的过程，也是孝文帝迁洛后汉化与鲜卑传统并存的直观证据。
  - name: 石雕坐佛
    period: 北魏
    description: —石灰岩质，带有明显的「秀骨清像」风格。佛像头顶磨光高肉髻，面相清秀，双眉高挑，鼻梁高挺，嘴角微翘略含笑意，结跏趺坐于方座上；身着褒衣博带式佛衣，衣摆层层垂覆座前。
    image_url: /img/e1fb4e88258b69be.jpg
    image_license: CC-BY-SA-4.0
    image_attribution: Windmemories
  - name: 高浮雕鹿头彩绘人物空心砖
    period: 西汉
    description: —洛阳火车站南广场出土。砖面正中高浮雕一只鹿头，上方为玉璧形图案，两侧各立一位红袍拱手的人物，四周阳线刻菱形纹。鹿头在当时被认为能引魂升天，两侧人物则是镇守天门的门吏或导引升天的扈从，整块砖是汉人对死后仙界的想象。
    image_url: /img/4953a62aa04e97c8.jpg
    image_license: CC-BY-SA-4.0
    image_attribution: Windmemories
  - name: 鎏金铜牛、金马
    period: 晋
    description: —鎏金铜牛高5厘米、长7.2厘米，虽通体土锈，仍看得出当年的精致。旁边的金马出土于兵庄河堤晋墓，披具装、昂首挺胸、四肢直立、尾巴高翘，小小一件却神气十足。
    image_url: /img/12ad98b62588c3bc.jpg
    image_license: CC-BY-SA-4.0
    image_attribution: Windmemories
dynasty_connections:
  - dynasty: 西周
    description: 周公以土圭测影求「天下之中」，营建成周洛邑；何尊铭文「宅兹中国」所指即此，是第一展厅「择中立国」的起点。
  - dynasty: 东汉
    description: 光武帝定都洛阳，太学鼎盛，熹平石经立于太学，昭君出塞镜等精品展现东汉都城气象。
  - dynasty: 曹魏
    description: 曹魏营建太极殿、刻正始三体石经；西朱村大墓出土的刻铭石牌，是曹魏皇室葬制的直接证据。
  - dynasty: 西晋
    description: 辟雍碑记晋武帝视学，荀岳墓志、晋墓金马，呈现西晋都城的礼制与士族生活。
  - dynasty: 北魏
    description: 孝文帝迁都洛阳并推行汉化，永宁寺、北邙帝陵、围屏石棺床与拜占庭金币，构成北魏洛阳民族融合与丝路交流的全景。
