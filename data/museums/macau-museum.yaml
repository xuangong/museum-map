id: macau-museum
name: 澳门博物馆
lat: 22.1975
lng: 113.5411
location: 澳门特别行政区花王堂区澳门博物馆前地112号（大炮台上，紧邻大三巴牌坊）
level: 澳门特别行政区文化局辖下综合性博物馆；馆址大炮台为世界文化遗产「澳门历史城区」组成部分
core_period: 新石器（路环黑沙遗址）—明清中西交汇—当代澳门
specialty: 建在大炮台之上的澳门通史馆。总面积2,800平方米，实际展览面积约2,100平方米，1998年4月18日落成开幕。三层展厅中两层建于大炮台平台之下，只有最上一层由原气象台地面建筑改建，最大限度保留了炮台原有的建筑风格与地貌。展览以复制品、模型结合光影声像强化陈列，主要收藏书画、外销瓷、民俗礼仪器物，以及火柴业、爆竹业、神香业等澳门传统行业实物与路环黑沙考古遗址出土物。登上大炮台，整个澳门城区尽收眼底。
dynasty_coverage: 新石器（路环黑沙遗址，距今约4,000余年）→ 明（16世纪葡人东来、中葡贸易鼎盛）→ 清（外销瓷、鸦片战争后地位变迁）→ 近现代（传统行业、1999年回归）
timeline: 约公元前4000年黑沙已有人类聚居 → 16世纪50年代葡萄牙商人以澳门为据点开拓远东航路 → 1617年耶稣会兴建大炮台 → 1625年西湾设铸炮厂 → 1965年军营改建气象台后开放为旅游区 → 1998年4月18日澳门博物馆落成开幕 → 2005年7月15日大炮台随「澳门历史城区」列入《世界遗产名录》
treasures:
  - name: 路环黑沙遗址出土石英环玦与彩陶片（新石器时代）
  - name: 明清中葡贸易外销瓷
  - name: 17世纪澳门铸炮厂所铸大炮
  - name: 澳门爆竹、火柴、神香三大传统行业实物与商标印版
  - name: 粤剧戏服与广东杖头、潮州铁枝、福建提线三类木偶
  - name: 土生葡人语言、烹调与生活文化实物
halls:
  - name: 一楼：澳门地区文明的原始（史前澳门、国际通商口岸、历史上的防御措施、多元化的宗教信仰）
  - name: 二楼：澳门民间艺术与传统（濠江景致、传统行业、娱乐及戏曲、民俗民生）
  - name: 三楼：当代澳门（中西文化艺术、城市发展及澳门回归）
  - name: 大炮台花园（世界文化遗产本体，可俯瞰澳门半岛全城）
artifacts:
  - name: 路环黑沙遗址出土物
    period: 新石器时代（距今约4,000余年）
    description: —黑沙是澳门最著名的史前遗址。1972年至2006年间考古人员历次发掘，出土骸骨、彩陶碎片、铜币、纽扣、石英制的环与玦，以及石斧、石锛等工具。遗址显示约公元前四千多年已有人类在此聚居，并存在制作水晶手环与耳饰的手工作坊。黑沙有山丘与平静小海湾，居民以渔猎为生——这是澳门历史的真正起点，比葡人东来早了四千年。
  - name: 明清中葡贸易外销瓷
    period: 明中晚期至清（16—19世纪）
    description: —16世纪50年代起，葡萄牙商人经澳门向中国内陆拓展贸易，开辟了通往日本、菲律宾、马六甲、印度、欧洲乃至南美与非洲的多条新航道，澳门由此成为远东最重要的通商口岸。鼎盛期在16世纪80年代：欧洲的时钟、毛织品是中国市场上的新奇物，中国的丝绸、瓷器、茶叶、漆器则由澳门远销东南亚与欧洲各国。这批外销瓷正是那条航路的实物账簿。
  - name: 澳门铸炮厂大炮
    period: 明末清初（17世纪）
    description: —17世纪初，葡萄牙人在明清政府「以夷制夷」的默许下，沿澳门海岸与战略要地陆续修筑炮台，形成覆盖东西海岸的火力防卫网，大炮台可架设多达32门炮，内设蓄水池、军需库与官兵营房，是当时澳门防御系统的中心。1625年葡人于西湾烧灰炉炮台附近开设铸造厂，所铸大炮除本地防务外，还供应中国、日本、东南亚及欧洲多国。
    image_url: /img/bc332aaa5b5f0c33.jpg
    image_license: CC-BY-SA-4.0
    image_attribution: K.Y.K.Z.K.
  - name: 复原历史街景与传统行业
    period: 19世纪后期至20世纪
    description: —二楼展区以实景复原昔日澳门街市：黄墙骑楼、凉茶铺、中药店与饼铺沿街排开，招牌与店面照旧时样式重制。爆竹、火柴、神香是20世纪澳门的主要传统手工业与出口产品——爆竹业19世纪后期已存在，至1990年代随宝昇炮竹厂结业而终结；火柴业自1920年代兴起至1970年代式微，半世纪间澳门火柴被认为是远东最好的产品，除本地外还供应香港、内地、东南亚与欧美；神香业今日仅存数家小作坊。这条街是澳门市井日常最直观的切片。
    image_url: /img/f3f5627ca62d1dcc.jpg
    image_license: CC-BY-3.0
    image_attribution: BrokenSphere
  - name: 粤剧与木偶戏藏品
    period: 清末至20世纪
    description: —澳门华洋杂处，居民以广东、福建人为多，民间娱乐带有浓厚地方色彩。粤剧以广州方言演出，流行于澳门、香港与两广，薰陶了一代又一代澳门居民。馆藏木偶涵盖广东杖头木偶、潮州铁枝木偶与福建提线木偶三大流派。斗蟋蟀等传统游戏亦在陈列之列，通常于每年立夏与初秋进行。
  - name: 土生葡人生活文化
    period: 16世纪至今
    description: —土生葡人是由东西方文化孕育而成的特殊社群，拥有独特的语言（澳门土语）与烹调艺术。四百多年间，澳门华人居民的烹调、服饰、婚礼、节日与语言既保留中国传统习俗，又渗入南欧文化风俗。道教、佛教与天主教、基督教、伊斯兰教等信仰在这片土地上并存共处，积累了丰富的宗教艺术品——这正是澳门作为「和平共处样本」的实证。
    image_url: /img/179dcaf3cab78230.jpg
    image_license: CC-BY-SA-3.0
    image_attribution: deror_avi
dynasty_connections:
  - dynasty: 新石器
    description: 路环黑沙遗址出土的彩陶、石英环玦与石器工具，将澳门的人类活动上溯至距今四千余年，属环珠江口史前文化圈。
  - dynasty: 明
    description: 16世纪中叶葡人东来，澳门成为远东最重要的通商口岸；1617年兴建的大炮台与明政府的默许，构成明代海上丝路西端的独特样本。
  - dynasty: 清
    description: 清代外销瓷、中西宗教并存与鸦片战争后五口通商导致澳门贸易地位下降，是理解近代中国对外关系的关键切面。
