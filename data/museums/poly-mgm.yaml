id: poly-mgm
name: 保利美高梅博物馆
lat: 22.1902
lng: 113.5497
location: 澳门外港新填海区孙逸仙大马路，澳门美高梅二楼
level: 保利文化与美高梅合办的民办博物馆，按国家一级文物展陈标准建造（免费参观）
core_period: 西周—当代（以丝绸之路沿线文明交流为主线）
specialty: 2024年开幕的澳门文旅新地标，由保利文化与美高梅携手打造，以国家一级文物展陈标准建造。定位为丝绸之路与世界文明交流互鉴的展示平台，采用可变式空间布局，可灵活承载不同主题的文物与艺术品。建筑设计向中国传统工艺致敬：前厅穹顶以多媒体层叠装置呈现数字艺术《丝路沙痕》；标志性非遗工艺柱糅合官式古建筑营造技艺与景泰蓝（铜胎掐丝珐琅）制作技艺，以掐丝珐琅装饰的斗拱为顶；地板镶嵌12款丝路沿线国家的传统图腾纹饰，自东向西依次铺装，在地面复现丝绸之路的文化路径。获2025年德国iF设计奖、2024年MUSE设计奖、2024年伦敦设计奖铂金奖、2024年纽约建筑设计奖金奖。
dynasty_coverage: 西周 → 西汉/东汉（丝路开通） → 唐（金银器与胡风） → 明清（宫廷织毯、外销与中西器物交流） → 近现代
timeline: 澳门自16世纪起即是海上丝绸之路的枢纽与中西文化交流的先驱 → 保利文化与美高梅以此为选址理由打造保利美高梅博物馆 → 2024年获伦敦设计奖铂金奖、纽约建筑设计奖金奖、MUSE设计奖 → 2025年获德国iF设计奖 → 2025年10月年度大展《丝路》开幕，展期至2026年8月
treasures:
  - name: 龙纹宝座毯（约明或清，美高梅自有藏品）
  - name: 铜车马仪仗队（汉，甘肃省博物馆藏，《丝路》特展借展）
  - name: 唐人物纹八棱金杯（唐，陕西历史博物馆藏，《丝路》特展借展）
  - name: 雍正款蓝色玻璃八棱瓶（清，故宫博物院藏，《丝路》特展借展）
  - name: 东汉铜摇钱树（东汉，绵阳市博物馆藏，《丝路》特展借展）
  - name: 非遗工艺柱（官式古建筑营造技艺 + 景泰蓝掐丝珐琅斗拱）
halls:
  - name: 前厅（穹顶多媒体层叠装置，数字艺术《丝路沙痕》）
  - name: 序厅（非遗工艺柱与12国图腾石材地板）
  - name: 《丝路》年度大展四大主题空间（2025年10月—2026年8月）
  - name: 可变式主题展厅
artifacts:
  - name: 龙纹宝座毯
    period: 约明或清（14—19世纪）
    description: —美高梅自有藏品，博物馆常驻展品。由山羊毛、羊羔毛及丝线织造，毯面饰双龙献珠图，上方为云纹，下方为海水江崖纹。这套纹样组合是明清宫廷御用规制的标志。同类宝座毯因材质脆弱、使用频繁而极难留存，本品整体保存完好，是中国丝织工艺的重要体现。
  - name: 铜车马仪仗队
    period: 汉（公元前202年—公元220年）
    description: —《丝路》特展借展，现藏甘肃省博物馆，展期至2026年8月。东汉铜车马仪仗俑队由八件、共五种铜俑组成：前方为持矛骑士俑与持戟骑士俑，马匹仰首翘尾作嘶鸣状，武士头戴平顶帽、身穿交领服，左手执辔、右手举戟或矛；其后两匹铜从骑分别饰有名为「雄胜」「糸介」的装饰物；中间为双辕轺车，舆底作镂空菱形；最后是两辆輂车。整队完整再现了汉代河西走廊高级官吏的出行仪仗，也是丝路开通后中原车马制度西传的实物。
  - name: 唐人物纹八棱金杯
    period: 唐（公元618年—907年）
    description: —《丝路》特展借展，现藏陕西历史博物馆，展期至2026年8月。八棱杯形制源自中亚粟特金银器，杯身分棱开光，各面锤揲人物形象，环柄带指垫。这种「胡瓶胡杯」在盛唐长安贵族间风靡一时，是粟特工匠沿丝路东来、其造型与錾刻技法被唐代金银器全面吸收的直接证据。
  - name: 雍正款蓝色玻璃八棱瓶
    period: 清雍正（1723—1735年）
    description: —《丝路》特展借展，现藏故宫博物院，展期至2026年8月。清宫造办处玻璃厂由康熙三十五年设立，聘欧洲传教士技师指导，所制单色玻璃器以宝石蓝、鸡油黄最负盛名。此瓶通体宝蓝，八棱形制承袭西亚金属器造型，底落雍正款——一件器物里同时装着欧洲技术、西亚形制与清宫审美。
  - name: 东汉铜摇钱树
    period: 东汉（公元25—220年）
    description: —《丝路》特展借展，现藏绵阳市博物馆，展期至2026年8月。摇钱树是汉代西南地区特有的随葬明器，陶座之上立青铜树干，枝叶缀满方孔圆钱、西王母、羽人与神兽。它把中原的西王母升仙信仰、蜀地的富庶想象与丝路输入的图像元素铸在一株树上，是研究汉代西南丝绸之路与民间信仰的核心材料。
  - name: 常玉《粉瓶小野菊》
    period: 1931年
    description: —《丝路》特展借展，香港私人收藏，展期至2026年8月。常玉1920年赴法，是最早融入巴黎画派的中国艺术家之一。此作以极简的粉色瓶身与疏落野菊构图，将中国文人画的留白与线条写入西方油画语言。展览以它作为丝路精神在现代的回响——文明互鉴并未随驼铃止步。
  - name: 卡纳莱托《从圣马可湾眺望码头》
    period: 1733—1734年
    description: —《丝路》特展借展，意大利保罗和卡罗莱纳·赞尼基金会藏，展期至2026年8月。画面沿码头展开，中心矗立总督宫、圣马可大教堂与钟楼，以两根石柱为标志的小广场是城市与海洋的边界。卡纳莱托借助前置草图与摄影暗箱等光学工具达成惊人精度，又通过调整透视与光线创造理想化景象。威尼斯是海上丝路的欧洲终点——这幅画正是终点在其影响力巅峰时的写照。
dynasty_connections:
  - dynasty: 西汉
    description: 张骞凿空西域后丝绸之路正式开通，展览以此为叙事起点，串起河西走廊沿线的车马、金银与织物。
  - dynasty: 东汉
    description: 借展的东汉铜车马仪仗队与铜摇钱树，呈现丝路贸易繁盛期河西与西南两条通道的物质文化。
  - dynasty: 唐
    description: 人物纹八棱金杯等唐代金银器，直观展示粟特工艺东传与盛唐长安的国际化风尚。
  - dynasty: 清
    description: 雍正款蓝色玻璃八棱瓶与宫廷织毯，反映清宫造办处吸收欧洲技术、澳门作为中西器物往来枢纽的历史。
