recommended_museums:
  - museum_id: gugong
    name: 故宫博物院
    location: 北京
    reason: 明代紫禁城本身就是最大的明代文物，加上馆藏的明代瓷器、书画、家具等
  - museum_id: nanjing
    name: 南京博物院
    reason: 明初都城所在地，大量明代文物
  - museum_id: jingdezhen
    name: 景德镇中国陶瓷博物馆
    location: 景德镇
    reason: 明代瓷器发展全貌，从永乐甜白到宣德青花到成化斗彩
  - museum_id: taipei-gugong
    name: 台北故宫博物院
    reason: 成化斗彩鸡缸杯（2014年拍卖价2.8亿港币的同款）、永乐宣德青花精品
  - museum_id: guobo
    name: 中国国家博物馆
    location: 北京
    reason: 明代文物综合收藏
  - museum_id: hubei
