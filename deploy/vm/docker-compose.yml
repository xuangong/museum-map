# Run from the repo root:  docker compose -f deploy/vm/docker-compose.yml up -d --build
name: museum-map
services:
  web:
    build:
      context: ../..
      dockerfile: deploy/vm/Dockerfile
    restart: always
    ports:
      - "8082:8787"   # trojan's nginx reaches it as host.docker.internal:8082
    volumes:
      - ./state:/data/state
      - ./.env.vm:/app/.dev.vars:ro
      - ./import:/import
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS -o /dev/null http://127.0.0.1:8787/ || exit 1"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 60s
